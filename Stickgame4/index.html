<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stick Game: Chapter 4 - Space Moon</title>
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; color: #fff; user-select: none; overflow: hidden; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        canvas { display: none; background: #020205; box-shadow: 0 0 20px rgba(255,51,51,0.3); border: 2px solid #ff3333; max-width: 100%; }
        
        .screen { display: flex; flex-direction: column; justify-content: center; align-items: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10; text-align: center; padding: 20px; box-sizing: border-box; }
        #introScreen, #outroScreen { display: none; background: #05050a; border: 4px solid #ff3333; }
        
        h1 { color: #ff3333; font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 0 10px #ff3333; }
        .comic-box { width: 90%; max-width: 600px; min-height: 250px; border: 3px dashed #ff3333; margin: 15px 0; background: #101015; display: flex; justify-content: center; align-items: center; border-radius: 8px; color: #555; font-weight: bold; }
        
        .btn { background: #ff3333; color: #fff; border: 2px solid #fff; padding: 12px 35px; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 15px; box-shadow: 0 4px 10px rgba(255,51,51,0.4); }
        .btn:active { transform: scale(0.95); }
        
        #ui { display: none; width: 100%; max-width: 800px; justify-content: space-between; padding: 10px; box-sizing: border-box; font-size: 1.1rem; font-weight: bold; background: rgba(20,20,30,0.8); border-bottom: 2px solid #ff3333; }
        #bossTimerContainer { display: none; color: #ff3333; text-shadow: 0 0 5px #ff0000; }
        
        #gameControls { display: none; width: 100%; max-width: 800px; justify-content: space-between; padding: 15px 20px; box-sizing: border-box; background: #0a0a0f; }
        .control-group { display: flex; gap: 15px; }
        .ctrl-btn { width: 65px; height: 65px; background: #222233; border: 2px solid #ff3333; color: white; font-size: 1.8rem; font-weight: bold; border-radius: 50%; display: flex; justify-content: center; align-items: center; touch-action: none; }
        .ctrl-btn:active { background: #ff3333; box-shadow: 0 0 15px #ff3333; }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="mainMenu" class="screen">
        <h1>STICK GAME</h1>
        <h3 style="color: #bbb; margin-top: 0;">Глава 4: Космическая Луна</h3>
        <button id="startBtn" class="btn">ИГРАТЬ</button>
    </div>

    <!-- НАЧАЛЬНЫЙ КОМИКС -->
    <div id="introScreen" class="screen">
        <h1>ГЛАВА 4</h1>
        <div class="comic-box">
            <img src="intro_comic.png" style="max-width: 100%; max-height: 60vh;">

        </div>
        <button id="introNextBtn" class="btn">В ПУТЬ! →</button>
    </div>

    <!-- ИГРОВОЙ ИНТЕРФЕЙС -->
    <div id="ui">
        <div>Уровень: <span id="levelNum" style="color:#ff3333;">1</span></div>
        <div id="bossTimerContainer">СТАТУС: <span id="bossTimer">0 / 4</span></div>
        <div>Смертей: <span id="deathCount" style="color:#ff3333;">0</span></div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <canvas id="gameCanvas"></canvas>

    <!-- СЕНСОРНОЕ УПРАВЛЕНИЕ -->
    <div id="gameControls">
        <div class="control-group">
            <div id="btnLeft" class="ctrl-btn">←</div>
            <div id="btnRight" class="ctrl-btn">→</div>
        </div>
        <div id="btnJump" class="ctrl-btn">↑</div>
    </div>

    <!-- ФИНАЛЬНЫЙ КОМИКС -->
    <div id="outroScreen" class="screen">
        <h1>ФИНАЛ ГЛАВЫ</h1>
        <div class="comic-box">
            <img src="outro_comic.png" style="max-width: 100%; max-height: 60vh;">

        </div>
        <div style="font-size: 1.2rem; margin: 10px 0;">Всего смертей: <span id="resDeaths" style="color:#ff3333; font-weight:bold;">0</span></div>
        <button id="outroCloseBtn" class="btn">В Меню →</button>
    </div>
</div>

<audio id="bgMusic" loop src="space_bg.mp3"></audio>
<audio id="bossMusic" loop src="boss_theme.mp3"></audio>

<script src="game.js"></script>
</body>
</html>
