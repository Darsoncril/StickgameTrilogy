<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stick Game: Chapter 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a0f0f; font-family: sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        #gameCanvas { display: none; background: #241414; margin: 0 auto; box-shadow: 0 0 25px rgba(255,100,0,0.4); }
        #mainMenu { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #190a0a; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        #menuTitle { color: #ff3333; font-size: 42px; font-weight: bold; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 15px rgba(255, 51, 51, 0.8); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        #menuSubtitle { color: #f5f5dc; font-size: 20px; font-weight: bold; margin-bottom: 20px; letter-spacing: 3px; text-transform: uppercase; }
        .menu-btn { width: 220px; height: 60px; background: rgba(255,51,51,0.05); border: 2px solid rgba(255,51,51,0.4); border-radius: 12px; color: white; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; text-transform: uppercase; transition: 0.2s; }
        .menu-btn:active { background: rgba(255, 51, 51, 0.4); border-color: #ff3333; box-shadow: 0 0 15px #ff3333; }
        
        /* Сенсорные кнопки */
        .controls { position: absolute; bottom: 20px; left: 20px; right: 20px; display: none; justify-content: space-between; pointer-events: none; }
        .btn-group { display: flex; gap: 15px; pointer-events: auto; }
        .btn { width: 75px; height: 75px; background: rgba(255,51,51,0.15); border: 2px solid rgba(255,51,51,0.6); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 32px; font-weight: bold; }
        .btn:active { background: rgba(255,51,51,0.4); }
        
        /* Интерфейс */
        #ui { position: absolute; top: 15px; left: 15px; right: 15px; color: white; font-size: 20px; font-weight: bold; pointer-events: none; text-shadow: 1px 1px 3px #000; display: none; }
        .ui-container { display: flex; justify-content: space-between; width: 100%; max-width: 800px; margin: 0 auto; }
        #bossTimerContainer { display: none; color: #ff3333; font-size: 24px; text-align: center; width: 100%; position: absolute; top: 50px; left: 0; font-family: 'Arial Black', sans-serif; }
        
        /* Экраны с вашими картинками-комиксами */
        .comic-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 10px; }
        .comic-img { max-width: 100%; max-height: 65vh; border: 3px solid #ffaa00; border-radius: 8px; object-fit: contain; }
        .comic-btn { margin-top: 20px; width: 180px; height: 50px; background: #ff3333; border: none; border-radius: 10px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .comic-btn:active { background: #cc0000; }

        /* Итоговые результаты */
        #resultsContainer { display: none; margin-top: 20px; background: rgba(255, 51, 51, 0.05); border: 2px solid rgba(255, 51, 51, 0.3); padding: 20px; border-radius: 12px; min-width: 280px; text-align: center; color: white; }
        .result-item { font-size: 22px; margin: 10px 0; font-weight: bold; }
        .result-val { color: #ffaa00; text-shadow: 0 0 5px rgba(255, 170, 0, 0.4); }
    </style>
</head>
<body>
    <!-- Ваша музыка -->
    <audio id="bgMusic" src="music2.mp3" loop></audio>
    <audio id="bossMusic" src="boss.mp3" loop></audio>

    <!-- Начальный комикс (ваша фотка intro2.png) -->
    <div id="introScreen" class="comic-screen">
        <img src="intro2.png" class="comic-img" alt="Глава 2: Начало">
        <button id="introNextBtn" class="comic-btn">В путь! →</button>
    </div>

    <!-- Финальный комикс после победы над Фараоном (ваша фотка outro2.png) -->
    <div id="outroScreen" class="comic-screen">
        <img id="outroImg" src="outro2.png" class="comic-img" alt="Глава 2: Финал">
        <div id="resultsContainer">
            <h2 style="color: #ff3333; margin-bottom: 15px; font-size: 28px;">ГЛАВА 2 ПРОЙДЕНА</h2>
            <div class="result-item">Смертей: <span id="resDeaths" class="result-val">0</span></div>
        </div>
        <button id="outroCloseBtn" class="comic-btn">В Меню →</button>
    </div>

    <!-- Главное Меню -->
    <div id="mainMenu">
        <div id="menuTitle">STICK GAME</div>
        <div id="menuSubtitle">Глава 2: Тайны пустыни</div>
        <div class="menu-btn" id="startBtn">Играть</div>
        <div class="menu-btn" id="loadBtn">Продолжить</div>
    </div>
    
    <!-- Игровой интерфейс со счетчиком смертей -->
    <div id="ui">
        <div class="ui-container">
            <div>Уровень: <span id="levelNum">1</span></div>
            <div>Смертей: <span id="deathCount" style="color: #ff3333;">0</span></div>
        </div>
        <div id="bossTimerContainer">До спасения: <span id="bossTimer">60</span>с</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <!-- Управление для мобилок -->
    <div class="controls" id="gameControls">
        <div class="btn-group">
            <div class="btn" id="btnLeft">←</div>
            <div class="btn" id="btnRight">→</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btnJump">↑</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
